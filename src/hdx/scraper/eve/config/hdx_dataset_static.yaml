notes: |
  This dataset contains flood exposure estimates from the FAO Data in Emergencies (DIEM) Events Visualization in Emergencies (EVE) system for each dekad (10-day period). For each country, first-level (ADM1) and second-level (ADM2) administrative unit, it gives the flooded area, flooded cropland, population and livestock (buffalo, cattle, chicken, goats, pigs and sheep) in flooded areas, as absolute values and percentages, split into exceptional flooding, seasonal flooding (flooding normally expected at that time of year) and total.

  EVE products are preliminary analyses that have not undergone field validation. Explore the data on the [EVE dashboard](https://diem-eve.apps.fao.org/) and send feedback to the [FAO DIEM team](https://data-in-emergencies.fao.org/pages/contactus).

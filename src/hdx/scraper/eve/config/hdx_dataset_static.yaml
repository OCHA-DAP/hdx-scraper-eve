license_id: cc-by
methodology: Other
methodology_other: |
  EVE detects flooding from NOAA VIIRS 5-day flood composites aggregated to dekads (10-day periods), compares it with the VISTA historical flood-frequency reference to separate seasonal from exceptional flooding, and overlays exposure layers: ESA WorldCover cropland, WorldPop 2020 population and FAO Gridded Livestock of the World 2020. Statistics are computed for FAO GAUL 2024 ADM2 units and summed to ADM1 and ADM0; percentages are recomputed at each level. See the [EVE Data Product Documentation](https://diem-eve.apps.fao.org/manuals/eve_data_manual.md).

  HDX adds admin1_pcode and admin2_pcode columns by matching GAUL names to the [Global P-Codes](https://data.humdata.org/dataset/global-pcodes) dataset (latest COD version per country at the time of each run). P-codes are left blank where no match is found, where no COD exists (Tanzania, and Viet Nam ADM2), and in countries whose GAUL and COD admin structures differ (ADM1: Burundi, Burkina Faso, Central African Republic, Madagascar, Mali, Myanmar, Viet Nam; ADM2: the same less Viet Nam, plus Haiti).
caveats: |
  Satellite flood detection may miss flooding under persistent cloud (VIIRS is optical), short-duration or flash floods, and urban floods, and may give false positives in coastal zones, marshlands, riverbanks, rice fields and wet soils. Check the cloud fields: a unit mostly under cloud may show 0 flood.

  A value of 0 is also used when an input or denominator is unavailable, so 0 is not proof that no flooding occurred. Flooded cropland does not indicate crop loss, and livestock figures are modelled and do not capture seasonal movements. ADM1 and ADM0 percentages are computed from summed ADM2 values, not averaged.

  GAUL codes and names are the primary admin identifiers; p-codes are name-matched by HDX and may contain errors. The boundaries and names used do not imply the expression of any opinion whatsoever on the part of FAO concerning the legal status of any country, territory, city or area or of its authorities, or concerning the delimitation of its frontiers and boundaries.
